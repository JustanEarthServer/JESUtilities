name: JESUtilities
version: '${version}'

main: dev.ciel.jesutilities.JESUtilities
api-version: '26.2'
load: POSTWORLD

permissions:
  jesutilities.autoboat:
    description: Allows using /autoboat
    default: true
  jesutilities.reload:
    description: Allows reloading the config with /autoboat reload
    default: op
